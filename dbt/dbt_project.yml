name: 'momentum_dbt'
version: '1.0.0'
config-version: 2

profile: 'momentum_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Valeurs par défaut issues de l'optimisation (seront écrasées par Airflow)
vars:
  sp500_sma_fast: 13
  sp500_sma_slow: 50
  stock_sma_fast: 13
  stock_sma_slow: 50
  etf_sma_fast: 13
  etf_sma_slow: 50
  stock_adx_threshold: 25.0
  stock_atr_threshold: 0.20
  stock_mom_period: 20
  etf_mom_period: 1

models:
  momentum_dbt:
    staging:
      +materialized: table
    gold:
      +materialized: table

on-run-start:
  - "{{ register_external_sources() }}"
