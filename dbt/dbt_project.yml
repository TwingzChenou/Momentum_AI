name: 'momentum_dbt'
version: '1.0.0'
config-version: 2

profile: 'momentum_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  momentum_dbt:
    staging:
      +materialized: table
      +file_format: delta
    marts:
      +materialized: table
      +file_format: delta
    gold:
      +materialized: table
      +file_format: delta


