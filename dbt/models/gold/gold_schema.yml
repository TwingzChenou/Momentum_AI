version: 2

models:
  - name: gold_stock_features
    description: "Indicateurs techniques calculés (Gold Layer) pour les actions du S&P 500."
    columns:
      - name: Ticker
        description: "Symbole de l'action (ex: AAPL)"
        tests:
          - not_null
      
      - name: Date
        description: "Date du calcul (Hebdomadaire - Vendredi)"
        tests:
          - not_null

      - name: SMA_fast
        description: "Moyenne mobile simple rapide (Window: 50)"

      - name: SMA_slow
        description: "Moyenne mobile simple lente (Window: 200)"

      - name: ADX
        description: "Average Directional Index (Force de la tendance)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

      - name: ATR_pct
        description: "Average True Range en pourcentage du prix (Volatilité normalisée)"
        tests:
          - not_null

      - name: Momentum_XM
        description: "Variation du prix sur la période de momentum"

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - Ticker
            - Date

  - name: gold_etf_features
    description: "Indicateurs techniques calculés (Gold Layer) pour les ETFs et l'Indice de référence (^GSPC)."
    columns:
      - name: Ticker
        description: "Symbole de l'actif"
        tests:
          - not_null
      
      - name: Date
        description: "Date du calcul"
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - Ticker
            - Date

  - name: gold_sp500_index_features
    description: "Indicateurs techniques complets pour l'indice S&P 500 (^GSPC)."
    columns:
      - name: Ticker
        description: "Symbole de l'indice (^GSPC)"
        tests:
          - not_null
          - accepted_values:
              values: ['^GSPC']
      - name: Date
        description: "Date du calcul"
        tests:
          - not_null
      - name: SMA_fast
        description: "Moyenne mobile simple rapide (Window: 50)"
      - name: SMA_slow
        description: "Moyenne mobile simple lente (Window: 200)"
      - name: ADX
        description: "Force de la tendance"
      - name: ATR
        description: "Average True Range"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - Ticker
            - Date
